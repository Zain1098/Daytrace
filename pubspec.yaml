name: daytrace
description: Offline-first Android personal task planner and activity timer.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.30.0
  drift_flutter: ^0.2.5
  # v12 removes the legacy Android Gradle script that is incompatible with AGP 9.
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.0.0
  flutter_timezone: ^5.1.0
  go_router: ^17.0.0
  http: ^1.6.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  permission_handler: ^13.0.1
  printing: ^5.15.0
  share_plus: ^13.3.0
  speech_to_text: ^7.4.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.7.0
  drift_dev: ^2.30.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
